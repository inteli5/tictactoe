[project]
name = "tictactoe"
version = "0.1.0"
description = "Reinforcement learning-based Tic Tac Toe game with a FastAPI web app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi[all]",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
