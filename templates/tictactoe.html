<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fdf6ee">
    <title>Tic-Tac-Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #fdf6ee;
            --cream-2: #f7ead9;
            --ink: #3b2a24;
            --ink-soft: #7a5b50;
            --pink: #f7b6c2;
            --pink-deep: #e58aa0;
            --blue-deep: #6bb8d6;
            --green-deep: #5fae6b;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', system-ui, sans-serif;
            color: var(--ink);
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(900px 600px at 85% -10%, #ffe6ec 0%, transparent 60%),
                radial-gradient(800px 500px at -10% 90%, #dff1fb 0%, transparent 60%),
                var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px 60px;
        }

        .card {
            position: relative;
            width: min(600px, 100%);
            background: #fffdf8;
            border-radius: 32px;
            padding: 32px 36px 36px;
            box-shadow: 0 30px 60px -30px rgba(110, 70, 55, .25), 0 2px 0 rgba(255, 255, 255, .9) inset;
            border: 1px solid rgba(245, 210, 200, .6);
        }

        .sparkles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            border-radius: 32px;
        }

        .sparkle {
            position: absolute;
            fill: currentColor;
            opacity: .6;
        }

        .s1 { top: 18px; right: 30px; width: 14px; height: 14px; color: #f5c66a; transform: rotate(10deg); }
        .s2 { bottom: 24px; left: 24px; width: 10px; height: 10px; color: var(--pink-deep); }
        .s3 { top: 120px; right: 18px; width: 11px; height: 11px; color: var(--blue-deep); }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 20%;
            border: 4px solid #fff;
            box-shadow: 0 10px 20px -10px rgba(110, 70, 55, .35), 0 0 0 2px var(--pink);
            flex-shrink: 0;
            display: block;
        }

        .title {
            margin: 0;
            font-size: 30px;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.1;
        }

        .subtitle {
            margin: 6px 0 0;
            font-family: 'Caveat', cursive;
            font-size: 22px;
            color: var(--ink-soft);
            line-height: 1.2;
        }

        .msgbox {
            position: relative;
            margin: 0 0 14px;
            padding: 16px 20px 16px 56px;
            background: linear-gradient(135deg, #e6f4fb 0%, #f5ecf6 50%, #ffeef0 100%);
            border: 1.5px solid #e3d7e8;
            border-radius: 20px;
            box-shadow: 0 6px 16px -10px rgba(229, 138, 160, .35);
            font-size: 16px;
            line-height: 1.55;
            color: #5a3a3f;
            min-height: 62px;
            display: flex;
            align-items: center;
        }

        .msgbox-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 2px #fadde2;
        }

        .msgbox-icon svg {
            width: 16px;
            height: 16px;
            fill: var(--pink-deep);
        }

        .msgbox-sparkle {
            position: absolute;
            right: 14px;
            top: 8px;
            width: 12px;
            height: 12px;
            fill: #f5c66a;
            opacity: .85;
        }

        .choose {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin: 0 0 18px;
            padding: 14px 18px;
            background: linear-gradient(180deg, #fff5e9, #fdeada);
            border-radius: 18px;
            border: 1px dashed #f0c9a9;
        }

        .choose-label {
            font-size: 15px;
            color: var(--ink-soft);
        }

        .choose-buttons {
            display: flex;
            gap: 10px;
        }

        .pill {
            appearance: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            color: var(--ink-soft);
            background: #fff;
            border: 2px solid #fff;
            box-shadow: 0 0 0 2px #f1e3d3;
            min-height: 44px;
            padding: 10px 18px;
            border-radius: 999px;
            letter-spacing: .02em;
            transition: transform .18s cubic-bezier(.3, 1.5, .5, 1), box-shadow .2s ease, background .25s ease;
        }

        .pill:hover {
            transform: translateY(-2px);
        }

        .pill:active {
            transform: translateY(0);
        }

        .pill.on {
            color: #8a3447;
            background: linear-gradient(180deg, #fde0e4, #f9bcc4);
            box-shadow:
                0 10px 22px -8px rgba(220, 120, 140, .5),
                0 0 0 2px #f4a8b3,
                inset 0 -3px 0 rgba(180, 80, 100, .16);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            width: min(372px, 100%);
            margin: 0 auto;
        }

        .cell {
            appearance: none;
            font-family: inherit;
            aspect-ratio: 1 / 1;
            padding: 0;
            border-radius: 20px;
            background: #fff;
            border: 2px solid #f1e3d3;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .18s ease, background .35s ease, border-color .35s ease, box-shadow .25s ease;
        }

        .cell.open,
        .cell.restart {
            cursor: pointer;
        }

        .cell.open:hover {
            transform: translateY(-1px);
            border-color: var(--pink);
            box-shadow: 0 10px 20px -14px rgba(229, 138, 160, .55);
        }

        .cell.open:active {
            transform: translateY(0);
        }

        .cell.win-o {
            background: var(--green-deep);
            border-color: var(--green-deep);
        }

        .cell.win-x {
            background: linear-gradient(180deg, #e58aa0, #d36e88);
            border-color: #d36e88;
        }

        .cell svg {
            width: 56px;
            height: 56px;
        }

        .mark-x {
            stroke: var(--pink-deep);
        }

        .mark-o {
            stroke: var(--blue-deep);
        }

        .cell.win-o svg,
        .cell.win-x svg {
            stroke: #fff;
        }

        .pop {
            animation: mark-pop .35s cubic-bezier(.5, 1.7, .5, 1) both;
        }

        @keyframes mark-pop {
            from { transform: scale(.4); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .cell:focus-visible,
        .pill:focus-visible,
        .modal-btn:focus-visible {
            outline: 3px solid var(--blue-deep);
            outline-offset: 2px;
        }

        /* Result popup */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(60, 30, 40, .45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 50;
            animation: fade-in .35s ease both;
        }

        .modal {
            width: min(440px, 100%);
            background: #fffdf8;
            border-radius: 28px;
            padding: 0 28px 28px;
            position: relative;
            box-shadow: 0 40px 80px -30px rgba(60, 30, 40, .4);
            text-align: center;
            border: 1px solid rgba(245, 210, 200, .7);
            animation: modal-in .45s cubic-bezier(.3, 1.5, .5, 1) both;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes modal-in {
            from { transform: translateY(20px) scale(.96); opacity: 0; }
            to { transform: none; opacity: 1; }
        }

        .modal-hero {
            margin: -46px auto 14px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 14px 30px -10px rgba(110, 70, 55, .35), 0 0 0 3px var(--pink);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .modal-hero svg {
            width: 52px;
            height: 52px;
        }

        .modal-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ffe2c4, #ffd0d8);
            color: #a85a3a;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .04em;
            margin-bottom: 10px;
        }

        .modal-badge svg {
            width: 10px;
            height: 10px;
            fill: currentColor;
        }

        .modal-title {
            font-size: 26px;
            font-weight: 600;
            margin: 4px 0 14px;
            color: var(--ink);
            line-height: 1.2;
        }

        .modal-title svg {
            display: inline-block;
            vertical-align: -2px;
            width: 20px;
            height: 20px;
            fill: var(--pink-deep);
        }

        .modal-body {
            font-size: 16px;
            line-height: 1.8;
            color: var(--ink-soft);
            margin: 0 0 22px;
            white-space: pre-line;
        }

        .modal-btn {
            appearance: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            background: linear-gradient(180deg, var(--pink-deep), #d36e88);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            padding: 14px 36px;
            border-radius: 999px;
            box-shadow: 0 12px 24px -10px rgba(229, 138, 160, .7);
            letter-spacing: .02em;
            transition: transform .15s ease, box-shadow .2s ease;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px -10px rgba(229, 138, 160, .85);
        }

        .modal-btn:active {
            transform: translateY(0);
        }

        /* Confetti */
        .confetti {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 60;
        }

        .confetti i {
            position: absolute;
            width: 10px;
            height: 14px;
            top: -20px;
            border-radius: 2px;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); opacity: .9; }
        }

        @media (max-width: 540px) {
            .card { padding: 24px 20px 28px; border-radius: 26px; }
            .sparkles { border-radius: 26px; }
            .s1 { top: 10px; right: 16px; }
            .header { gap: 16px; }
            .avatar { width: 78px; height: 78px; }
            .title { font-size: 24px; }
            .msgbox { font-size: 15px; padding: 14px 16px 14px 50px; min-height: 60px; }
            .msgbox-icon { left: 12px; width: 28px; height: 28px; }
            .msgbox-icon svg { width: 14px; height: 14px; }
            .choose { flex-direction: column; align-items: flex-start; gap: 8px; }
            .choose-buttons { width: 100%; }
            .pill { flex: 1; font-size: 15px; padding: 10px 12px; }
            .grid { gap: 10px; width: 100%; }
            .cell svg { width: 48px; height: 48px; }
            .modal-hero { width: 110px; height: 110px; margin-top: -40px; }
            .modal-hero svg { width: 44px; height: 44px; }
            .modal-title { font-size: 22px; }
            .modal-title svg { width: 18px; height: 18px; }
            .modal-body { font-size: 15px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .pop, .modal, .modal-backdrop, .confetti i { animation: none; }
            .cell, .pill, .modal-btn { transition: none; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="sparkles" aria-hidden="true">
            <svg class="sparkle s1" viewBox="0 0 24 24"><path d="M12 2C12.8 8 16 11.2 22 12C16 12.8 12.8 16 12 22C11.2 16 8 12.8 2 12C8 11.2 11.2 8 12 2Z"/></svg>
            <svg class="sparkle s2" viewBox="0 0 24 24"><path d="M12 2C12.8 8 16 11.2 22 12C16 12.8 12.8 16 12 22C11.2 16 8 12.8 2 12C8 11.2 11.2 8 12 2Z"/></svg>
            <svg class="sparkle s3" viewBox="0 0 24 24"><path d="M12 2C12.8 8 16 11.2 22 12C16 12.8 12.8 16 12 22C11.2 16 8 12.8 2 12C8 11.2 11.2 8 12 2Z"/></svg>
        </div>

        <header class="header">
            <img class="avatar" src="/static/girl.jpg" alt="">
            <div>
                <h1 class="title">The AI Tic Tac Toe Game</h1>
                <p class="subtitle">you're O, the AI is X</p>
            </div>
        </header>

        <div class="msgbox" aria-live="polite">
            <span class="msgbox-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </span>
            <svg class="msgbox-sparkle" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2C12.8 8 16 11.2 22 12C16 12.8 12.8 16 12 22C11.2 16 8 12.8 2 12C8 11.2 11.2 8 12 2Z"/></svg>
            <span id="message">Your turn: pick an empty square.</span>
        </div>

        <section class="choose" id="choosePlayer">
            <div class="choose-label">Who goes first?</div>
            <div class="choose-buttons">
                <button type="button" class="pill" id="playerO" aria-pressed="false">You (O) first</button>
                <button type="button" class="pill on" id="playerX" aria-pressed="true">AI (X) first</button>
            </div>
        </section>

        <div class="grid"></div>
    </main>

    <div class="modal-backdrop" id="modal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-hero" id="modalHero" aria-hidden="true"></div>
            <div class="modal-badge">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2C12.8 8 16 11.2 22 12C16 12.8 12.8 16 12 22C11.2 16 8 12.8 2 12C8 11.2 11.2 8 12 2Z"/></svg>
                <span>Game over</span>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2C12.8 8 16 11.2 22 12C16 12.8 12.8 16 12 22C11.2 16 8 12.8 2 12C8 11.2 11.2 8 12 2Z"/></svg>
            </div>
            <h2 class="modal-title">
                <span id="modalTitle"></span>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2C12.8 8 16 11.2 22 12C16 12.8 12.8 16 12 22C11.2 16 8 12.8 2 12C8 11.2 11.2 8 12 2Z"/></svg>
            </h2>
            <p class="modal-body" id="modalBody"></p>
            <button type="button" class="modal-btn" id="modalClose">Play again</button>
        </div>
    </div>

    <script>
        const X_ICON = '<svg class="mark-x" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>';
        const O_ICON = '<svg class="mark-o" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/></svg>';
        const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];

        // The server's result messages, with the winner ('X' is the AI, 'O' is you) and the popup text.
        const RESULTS = {
            'AI wins!': { winner: 'X', body: 'The AI got three in a row this time.\nFancy a rematch?' },
            'You win!': { winner: 'O', body: 'You got three in a row before the AI did.\nNicely played!' },
            'It is a draw!': { winner: null, body: 'Nobody got three in a row.\nOne more round?' },
        };

        // "Tap" on touch screens, "Click" elsewhere.
        const ACTION_WORD = window.matchMedia('(hover: none)').matches ? 'Tap' : 'Click';

        const grid = document.querySelector('.grid');
        const messageElement = document.getElementById('message');
        const playerOButton = document.getElementById('playerO');
        const playerXButton = document.getElementById('playerX');
        const modal = document.getElementById('modal');
        const modalClose = document.getElementById('modalClose');

        let gameState = {
            board: [['', '', ''], ['', '', ''], ['', '', '']],
            player_who_move_first: 'X',
            message: '',
        };
        // True while a request is in flight, so double clicks cannot send two moves.
        let busy = false;

        function currentResult() {
            return Object.hasOwn(RESULTS, gameState.message) ? RESULTS[gameState.message] : null;
        }

        function winningLine(symbol) {
            const cells = gameState.board.flat();
            return LINES.find((line) => line.every((i) => cells[i] === symbol)) || [];
        }

        async function makeMove(x, y) {
            if (busy) {
                return;
            }
            // Clicking the board after the game is over starts a new game.
            if (currentResult()) {
                init_board(gameState.player_who_move_first);
                return;
            }

            busy = true;
            try {
                const response = await fetch('/make_move', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({state: gameState, x: x, y: y})
                });

                if (response.ok) {
                    const previousBoard = gameState.board;
                    gameState = await response.json();
                    drawBoard(previousBoard);
                    showMessage();
                    const result = currentResult();
                    if (result) {
                        openModal(result);
                    }
                } else {
                    console.error('Invalid move or request error.');
                }
            } finally {
                busy = false;
            }
        }

        // previousBoard is null for a new game; otherwise only marks that changed pop in.
        function drawBoard(previousBoard) {
            const focusedIndex = Array.prototype.indexOf.call(grid.children, document.activeElement);
            const result = currentResult();
            const line = result && result.winner ? winningLine(result.winner) : [];

            grid.innerHTML = '';
            gameState.board.forEach((row, x) => {
                row.forEach((cell, y) => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'cell';
                    if (!cell && !result) {
                        button.classList.add('open');
                    }
                    if (result) {
                        button.classList.add('restart');
                    }
                    if (line.includes(x * 3 + y)) {
                        button.classList.add(result.winner === 'O' ? 'win-o' : 'win-x');
                    }
                    button.setAttribute('aria-label', `Row ${x + 1}, column ${y + 1}: ${cell || 'empty'}`);
                    if (cell) {
                        button.innerHTML = cell === 'X' ? X_ICON : O_ICON;
                        if (!previousBoard || previousBoard[x][y] !== cell) {
                            button.firstChild.classList.add('pop');
                        }
                    }
                    button.onclick = () => makeMove(x, y);
                    grid.appendChild(button);
                });
            });

            if (focusedIndex >= 0) {
                grid.children[focusedIndex].focus();
            }
        }

        function showMessage() {
            if (currentResult()) {
                messageElement.textContent = `${gameState.message} ${ACTION_WORD} the board to start a new game.`;
            } else if (gameState.message === 'Invalid Move!') {
                messageElement.textContent = 'Invalid move! That square is already taken.';
            } else {
                messageElement.textContent = 'Your turn: pick an empty square.';
            }
        }

        function updatePlayerButtons() {
            const aiFirst = gameState.player_who_move_first === 'X';
            playerXButton.classList.toggle('on', aiFirst);
            playerXButton.setAttribute('aria-pressed', String(aiFirst));
            playerOButton.classList.toggle('on', !aiFirst);
            playerOButton.setAttribute('aria-pressed', String(!aiFirst));
        }

        // Start a new game. player is 'X' if the AI moves first, or 'O' if you move first.
        // When the AI moves first, the server makes its opening move.
        async function init_board(player) {
            if (busy) {
                return;
            }

            busy = true;
            try {
                const response = await fetch('/new_game', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({player_who_move_first: player})
                });

                if (response.ok) {
                    gameState = await response.json();
                    closeModal();
                    drawBoard(null);
                    showMessage();
                    updatePlayerButtons();
                } else {
                    console.error('Could not start a new game.');
                }
            } finally {
                busy = false;
            }
        }

        function openModal(result) {
            const hero = document.getElementById('modalHero');
            if (result.winner === 'X') {
                hero.innerHTML = X_ICON;
            } else if (result.winner === 'O') {
                hero.innerHTML = O_ICON;
            } else {
                hero.innerHTML = X_ICON + O_ICON;
            }
            document.getElementById('modalTitle').textContent = gameState.message;
            document.getElementById('modalBody').textContent = result.body;
            modal.hidden = false;
            modalClose.focus();
            if (result.winner === 'O') {
                launchConfetti();
            }
        }

        function closeModal() {
            modal.hidden = true;
        }

        function launchConfetti() {
            const colors = ['#f7b6c2', '#e58aa0', '#a9dcef', '#6bb8d6', '#ffd97a', '#b6e3b6', '#ffb27a'];
            const layer = document.createElement('div');
            layer.className = 'confetti';
            document.body.appendChild(layer);
            for (let i = 0; i < 80; i++) {
                const piece = document.createElement('i');
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
                piece.style.animationDelay = (Math.random() * 0.6) + 's';
                piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                piece.style.opacity = 0.7 + Math.random() * 0.3;
                if (Math.random() < 0.4) {
                    piece.style.borderRadius = '50%';
                    piece.style.width = '8px';
                    piece.style.height = '8px';
                }
                layer.appendChild(piece);
            }
            setTimeout(() => layer.remove(), 6000);
        }

        playerXButton.addEventListener('click', () => init_board('X'));
        playerOButton.addEventListener('click', () => init_board('O'));
        modalClose.addEventListener('click', () => init_board(gameState.player_who_move_first));
        modal.addEventListener('click', (event) => {
            if (event.target === modal) {
                closeModal();
            }
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // By default, the AI moves first.
        init_board('X');
    </script>
</body>
</html>
